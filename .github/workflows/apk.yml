name: Fire TV app (APK)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK on the "apk-latest" release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Work out the hub address
        id: url
        env:
          OVERRIDE: ${{ vars.HUB_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$OVERRIDE" ]; then echo "hub=$OVERRIDE" >> "$GITHUB_OUTPUT";
          else echo "hub=https://${OWNER,,}.github.io/${REPO}/" >> "$GITHUB_OUTPUT"; fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HUB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hub.keystore"
            echo "HUB_KEYSTORE=$RUNNER_TEMP/hub.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No HUB_KEYSTORE_B64 secret: APK is debug-signed, so updates will need an uninstall first."
          fi

      - name: Build
        env:
          HUB_KEYSTORE_PASSWORD: ${{ secrets.HUB_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease -PhubUrl="${{ steps.url.outputs.hub }}" -PversionCode=${{ github.run_number }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk home-hub.apk
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Fire TV app" --notes "Latest Fire TV build. Hub: ${{ steps.url.outputs.hub }}"
          gh release upload apk-latest home-hub.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: home-hub-apk
          path: home-hub.apk
